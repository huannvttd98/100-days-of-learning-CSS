<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>
      Blobby: It appears, wobbles, changes its shape and disappears again. Just
      like that.
    </title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="frame">
      <div class="blobb">+ 200</div>
      <div class="blobb-ring"></div>

      <svg class="octagon" width="100" height="100" viewBox="0 0 100 100">
        <polygon points="30,0 70,0 100,30 100,70 70,100 30,100 0,70 0,30" />

        <text
          x="50"
          y="55"
          text-anchor="middle"
          fill="#333"

        >
          +200
        </text>
      </svg>
      <svg class="triangle">
        <polygon points="53,0 106,90 0,90" />
      </svg>
      <div class="octa-sparkles">
        <div class="sparkle s1"></div>
        <div class="sparkle s2"></div>
        <div class="sparkle s3"></div>
        <div class="sparkle s4"></div>
      </div>
      <div class="triangle-sparkles">
        <div class="sparkle s1"></div>
        <div class="sparkle s2"></div>
        <div class="sparkle s3"></div>
      </div>
    </div>
  </body>
</html>
