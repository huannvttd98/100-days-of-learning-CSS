<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Anime.js Animation Project</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="frame">
      <div class="slide-box">
        <div class="content-tile">
          <h2>Anime.js Animation Project</h2>
          <p>
            This project demonstrates basic animations using the Anime.js
            library. Use the buttons to control the animation of the box above.
          </p>
        </div>
        <div class="countdown-box">
          <div class="animated-box">10s</div>
          <div class="button-group">
            <button id="start-btn" class="btn">Start Animation</button>
            <button id="pause-btn" class="btn">Pause Animation</button>
            <button id="reset-btn" class="btn">Reset Animation</button>
          </div>
        </div>
      </div>
    </div>

    <!-- Anime.js Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.1/anime.min.js"></script>
    <script src="script.js"></script>
  </body>
</html>
