<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400..700&display=swap"
      rel="stylesheet"
    />
    <title>You Win Effect</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="frame-win">
      <div class="rays"></div>
      <div class="center-circle">
        <div class="win-text">You win</div>
      </div>
      <div class="circle-dots"></div>
    </div>
    <div class="frame-count">
    </div>

    <div class="countdown-display">
      <div class="countdown-number">5</div>
    </div>

    <!-- Half-screen overlay that slides right when countdown finishes -->
    <div class="screen-overlay">
      <div class="overlay-content">
        <h2>Get Ready!</h2>
        <p>Something amazing is coming...</p>
      </div>
    </div>

    <button class="open-modal-win">Open</button>
    <script src="script.js"></script>
  </body>
</html>
